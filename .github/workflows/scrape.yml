name: scrape

on:
  push:
    branches: [main]
    paths:
      - "links.txt"
      - "inbox/**"
      - "app/**"
      - "scripts/**"
      - "knowledge-base/**"
      - "insurance-*.json"
  schedule:
    - cron: "30 5 * * *" # 06:30-07:30 Madrid, daily refresh of all listings
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Scrape new links + refresh existing
        run: node scripts/run-scrape.js

      - name: Build dashboard data
        run: node scripts/build-dashboard.mjs

      - name: Sync UI to public app repo
        env:
          APP_DEPLOY_KEY: ${{ secrets.APP_DEPLOY_KEY }}
        run: node scripts/sync-app.mjs

      - name: Commit data updates (self-healing)
        run: |
          git config user.name "nnext-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add -A data app inbox
            if git diff --cached --quiet; then
              echo "No data changes"
              exit 0
            fi
            git commit -m "scrape: update data [skip ci]" || true
            if git push; then
              echo "pushed (attempt $attempt)"
              exit 0
            fi
            echo "push failed (attempt $attempt) — re-syncing with remote"
            git fetch origin main
            git reset --hard origin/main
            node scripts/run-scrape.js --new-only >/dev/null 2>&1 || true
          done
          echo "Giving up after 3 attempts"
          exit 1
