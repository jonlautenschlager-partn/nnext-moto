name: scrape

on:
  push:
    branches: [main]
    paths:
      - "links.txt"
      - "inbox/**"
      - "scripts/**"
      - "knowledge-base/**"
      - "insurance-*.json"
  schedule:
    - cron: "30 5 * * *" # 06:30-07:30 Madrid, daily refresh of all listings
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Scrape new links + refresh existing
        run: node scripts/run-scrape.js

      - name: Build dashboard data
        run: node scripts/build-dashboard.mjs

      - name: Sync UI to public app repo
        env:
          APP_DEPLOY_KEY: ${{ secrets.APP_DEPLOY_KEY }}
        run: node scripts/sync-app.mjs

      - name: Commit data updates
        run: |
          git config user.name "nnext-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data dashboard inbox
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "scrape: update data [skip ci]"
            git push
          fi
